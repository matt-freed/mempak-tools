name: Build

# - Pull requests: test and package only.
# - Push to main: test and package, then publish a new versioned release.
#
# Release versions are <major>.<minor>.<run number>: major.minor come from
# the VERSION file, and the patch is this workflow's run number, so every
# release is numbered higher than the last.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(grep -oE '^[0-9]+\.[0-9]+$' VERSION)
          if [ -z "$base" ]; then echo "VERSION must contain <major>.<minor>" >&2; exit 1; fi
          version="$base.${{ github.run_number }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            version="$version-pr${{ github.event.number }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Offline tests
        run: |
          go build -o build/ ./cmd/mempak
          bin="$PWD/build/mempak"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          bash tests/offline.sh "$bin"

  package:
    needs: [ version, test ]
    # macOS has lipo for the universal binary; everything else cross-compiles.
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          build() { GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$3" ./cmd/mempak; }
          build linux amd64 out/linux/mempak
          build windows amd64 out/windows/mempak.exe
          build darwin amd64 out/darwin-amd64/mempak
          build darwin arm64 out/darwin-arm64/mempak
          mkdir -p out/macos
          lipo -create -output out/macos/mempak out/darwin-amd64/mempak out/darwin-arm64/mempak
          out/macos/mempak --version
      - name: Package
        run: |
          pkg() { mkdir -p "pkg/$1"; cp "$2" README.md LICENSE "pkg/$1/"; }
          pkg mempak-macos-universal out/macos/mempak
          pkg mempak-linux-x86_64 out/linux/mempak
          cp scripts/10-raphnet.rules pkg/mempak-linux-x86_64/
          pkg mempak-windows-x86_64 out/windows/mempak.exe
          mkdir dist
          # tar keeps the executable bit, which upload-artifact would drop.
          tar -C pkg -czf dist/mempak-macos-universal.tar.gz mempak-macos-universal
          tar -C pkg -czf dist/mempak-linux-x86_64.tar.gz mempak-linux-x86_64
          (cd pkg && zip -r ../dist/mempak-windows-x86_64.zip mempak-windows-x86_64)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  release:
    # Only after every build and test passed, and never for pull requests.
    needs: [ version, package ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Create release
        run: |
          # Re-running a workflow keeps its run number; don't fail if this
          # version was already published by an earlier attempt.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "mempak ${TAG#v}" \
            --generate-notes
